name: Aya Market Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore debug keystore for CI build
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Restore and verify google-services.json for all 3 apps
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ADMIN_GOOGLE_SERVICES_JSON: ${{ secrets.ADMIN_GOOGLE_SERVICES_JSON }}
          DRIVER_GOOGLE_SERVICES_JSON: ${{ secrets.DRIVER_GOOGLE_SERVICES_JSON }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import base64, json, os, sys

          targets = {
              "app": "com.aistudio.ayamarket.kxmpzq",
              "admin": "com.aistudio.ayamarket.admin.kxmpzq",
              "driver": "com.aistudio.ayamarket.driver.kxmpzq",
          }

          def parse_json(raw):
              if not raw or not raw.strip():
                  return None, "empty"
              cleaned = (
                  raw.strip()
                  .lstrip("\ufeff")
                  .replace("\u201c", '"')
                  .replace("\u201d", '"')
                  .replace("\u00a0", " ")
              )
              try:
                  return json.loads(cleaned), "ok"
              except Exception as exc:
                  return None, f"invalid JSON ({exc})"

          def get_packages(data):
              if not isinstance(data, dict):
                  return []
              return [
                  c.get("client_info", {}).get("android_client_info", {}).get("package_name")
                  for c in data.get("client", [])
              ]

          def has_package(data, pkg):
              return pkg in get_packages(data)

          raw_secret = os.environ.get("GOOGLE_SERVICES_JSON", "")
          secret_main, secret_status = parse_json(raw_secret)
          if not secret_main and os.environ.get("GOOGLE_SERVICES_JSON_BASE64"):
              try:
                  decoded = base64.b64decode("".join(os.environ["GOOGLE_SERVICES_JSON_BASE64"].split())).decode("utf-8")
                  secret_main, secret_status = parse_json(decoded)
              except Exception as exc:
                  secret_main, secret_status = None, f"invalid base64 ({exc})"

          admin_secret, _ = parse_json(os.environ.get("ADMIN_GOOGLE_SERVICES_JSON", ""))
          driver_secret, _ = parse_json(os.environ.get("DRIVER_GOOGLE_SERVICES_JSON", ""))
          per_module_secrets = {
              "app": secret_main,
              "admin": admin_secret or secret_main,
              "driver": driver_secret or secret_main,
          }

          fallback_sources = []
          for candidate in [
              "app/google-services.json",
              "app/google-services",
              "google-services.json",
              "google-services",
              "admin/google-services.json",
              "admin/google-services",
              "driver/google-services.json",
              "driver/google-services",
          ]:
              if os.path.exists(candidate):
                  with open(candidate, "r", encoding="utf-8") as f:
                      parsed, status = parse_json(f.read())
                  print(f"Found {candidate}: {status}, packages={get_packages(parsed)}")
                  if parsed:
                      fallback_sources.append((candidate, parsed))
              else:
                  print(f"Not found: {candidate}")

          missing = []
          for mod, pkg in targets.items():
              path = f"{mod}/google-services.json"
              existing = None
              if os.path.exists(path):
                  with open(path, "r", encoding="utf-8") as f:
                      existing, _ = parse_json(f.read())

              chosen = None
              if has_package(per_module_secrets[mod], pkg):
                  chosen = per_module_secrets[mod]
              elif has_package(existing, pkg):
                  chosen = existing
              else:
                  for _, src_data in fallback_sources:
                      if has_package(src_data, pkg):
                          chosen = src_data
                          break

              if chosen is not None:
                  with open(path, "w", encoding="utf-8") as f:
                      json.dump(chosen, f, indent=2)
                  print(f"OK: {path} configured for {pkg}")
              else:
                  if os.path.exists(path):
                      os.remove(path)
                      print(f"::warning::Removed mismatched {path} (did not contain client {pkg})")
                  missing.append(f"{mod} ({pkg})")

          if missing:
              first_parsed = secret_main or (fallback_sources[0][1] if fallback_sources else None)
              found_pkgs = [p for p in get_packages(first_parsed) if p]
              msg = (
                  f"GOOGLE_SERVICES_JSON secret status: {secret_status}; packages found: {found_pkgs}. "
                  "Missing Firebase client config for: " + ", ".join(missing) + ". "
                  "Make sure you Push the latest changes from AI Studio to GitHub, AND either put app/google-services.json "
                  "into Repository secret GOOGLE_SERVICES_JSON or upload app/google-services.json to the repo."
              )
              if os.environ.get("EVENT_NAME") in ("push", "workflow_dispatch"):
                  print(f"::error::{msg}")
                  sys.exit(1)
              else:
                  print(f"::warning::{msg}")
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --tests "com.example.ExampleUnitTest"

      - name: Build Customer, Admin, and Driver Debug APKs
        run: gradle :app:assembleDebug :admin:assembleDebug :driver:assembleDebug

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: aya-customer-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: aya-admin-debug-apk
          path: admin/build/outputs/apk/debug/*.apk

      - name: Upload Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: aya-driver-debug-apk
          path: driver/build/outputs/apk/debug/*.apk
