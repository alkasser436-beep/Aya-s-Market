name: Aya Market Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore debug keystore for CI build
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Restore google-services.json for all 3 apps
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            fi
          fi

          if [ -f app/google-services.json ]; then
            [ -f admin/google-services.json ] || cp app/google-services.json admin/google-services.json
            [ -f driver/google-services.json ] || cp app/google-services.json driver/google-services.json
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "::error::Missing google-services.json! Add your app/google-services.json content as a GitHub Secret named GOOGLE_SERVICES_JSON (Repo Settings -> Secrets and variables -> Actions), or export/download the APK directly from AI Studio."
            exit 1
          else
            echo "::warning::google-services.json is not present in this PR build; Firebase Sign-In will be disabled in generated APKs."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --tests "com.example.ExampleUnitTest"

      - name: Build Customer, Admin, and Driver Debug APKs
        run: gradle :app:assembleDebug :admin:assembleDebug :driver:assembleDebug

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: aya-customer-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: aya-admin-debug-apk
          path: admin/build/outputs/apk/debug/*.apk

      - name: Upload Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: aya-driver-debug-apk
          path: driver/build/outputs/apk/debug/*.apk
